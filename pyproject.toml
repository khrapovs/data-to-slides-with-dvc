[project]
name = "data-to-slides-with-dvc"
version = "0.1.0"
description = "From raw data to management slides with DVC"
authors = [{ name = "Stanislav Khrapov", email = "khrapovs@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dvc>=3.57.0",
  "jupyterlab>=4.3.2",
  "loguru>=0.7.2",
  "matplotlib>=3.9.3",
  "polars>=1.15.0",
  "prek>=0.4.10",
  "scikit-learn>=1.5.2",
]

[project.urls]
Source = "https://github.com/khrapovs/data-to-slides-with-dvc"

[tool.ruff]
line-length = 120
src = ["dvc"]

[tool.ruff.lint]
select = ["E", "F", "D", "B", "I", "ARG", "ANN"]
ignore = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  "D213",
  "D417",
]
preview = true
extend-select = ["PLR0917"]

[tool.ruff.lint.pylint]
max-positional-args = 1

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty.rules]
no-matching-overload = "ignore"
