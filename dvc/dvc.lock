schema: '2.0'
stages:
  download_raw_data:
    cmd: wget
      https://archive.ics.uci.edu/ml/machine-learning-databases/wine/wine.data
      -O ./data/raw_data.csv
    deps:
    - path:
        https://archive.ics.uci.edu/ml/machine-learning-databases/wine/wine.data
      hash: md5
      checksum: '309537880734692826012589254825020078659'
    outs:
    - path: ./data/raw_data.csv
      hash: md5
      md5: 3e584720e6718d28509f86f05b7885a1
      size: 10782
  transform_data:
    cmd: python dvc/transform_data.py
    deps:
    - path: ./data/raw_data.csv
      hash: md5
      md5: 3e584720e6718d28509f86f05b7885a1
      size: 10782
    - path: ./dvc/transform_data.py
      hash: md5
      md5: 3a2efe345377320048701e5dcc230f04
      size: 967
    outs:
    - path: ./data/transformed_data.parquet
      hash: md5
      md5: 8571a14803e24a1f6493cd90e5f3b82c
      size: 11096
  train_model:
    cmd: python dvc/train_model.py
    deps:
    - path: ./data/transformed_data.parquet
      hash: md5
      md5: 8571a14803e24a1f6493cd90e5f3b82c
      size: 11096
    - path: ./dvc/train_model.py
      hash: md5
      md5: 81437c656ed07a41b8c8e11e5fb40606
      size: 904
    outs:
    - path: ./data/model.joblib
      hash: md5
      md5: 59e2a51018d25f37678cd45cc097c4c2
      size: 4891
  slides:
    cmd:
    - "jupyter nbconvert ./dvc/slides.ipynb \\\n  --output-dir ./data \\\n  --to slides
      --no-prompt --execute \\\n  --TagRemovePreprocessor.remove_input_tags \"hide-input\""
    deps:
    - path: ./data/model.joblib
      hash: md5
      md5: 59e2a51018d25f37678cd45cc097c4c2
      size: 4891
    - path: ./data/transformed_data.parquet
      hash: md5
      md5: 8571a14803e24a1f6493cd90e5f3b82c
      size: 11096
    - path: ./dvc/slides.ipynb
      hash: md5
      md5: 25433322320c78d3195c4e202c661b86
      size: 2538
    outs:
    - path: ./data/slides.slides.html
      hash: md5
      md5: 69cb82aaa9d7c74753fe42d0b1c0608c
      size: 298155
